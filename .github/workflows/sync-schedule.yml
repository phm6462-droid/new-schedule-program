name: Sync Meditong Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-meditong-schedule
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser renderer
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Download latest schedule pages
        timeout-minutes: 8
        env:
          SYNC_START_MONTH: "2026-03"
          SYNC_FUTURE_MONTHS: "1"
          MEDITONG_GROUP_NO: "5119"
          MEDITONG_COOKIE: ${{ secrets.MEDITONG_COOKIE }}
        run: python scripts/sync_schedule.py

      - name: Commit changed schedule data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update schedule data"
          git push
